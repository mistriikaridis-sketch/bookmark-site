<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下一站，上岸！ | Ultimate Edition</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* 铂金白瓷高级配色 */
            --bg-body: #F5F7FA;
            --surface: #FFFFFF;
            --primary: #2C3E50;     /* 极深灰 */
            --accent: #D4AF37;      /* 香槟金 */
            --secondary: #95A5A6;
            --border: #E1E8ED;
            
            --radius-box: 20px;
            --radius-btn: 50px;
            --shadow-card: 0 10px 40px rgba(0,0,0,0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- 顶部导航 --- */
        header {
            padding: 0 40px;
            height: 80px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 50;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand i { color: var(--accent); }

        .nav-pills {
            display: flex;
            background: #F2F4F7;
            padding: 5px;
            border-radius: var(--radius-btn);
        }

        .nav-btn {
            border: none;
            background: transparent;
            padding: 10px 30px;
            border-radius: var(--radius-btn);
            font-size: 14px;
            font-weight: 600;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .nav-btn.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* --- 主容器 --- */
        .main-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .module-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 40px;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .module-view.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* --- 模块1：自我介绍 --- */
        .intro-container {
            max-width: 1200px;
            margin: 0 auto;
            height: 100%;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 20px;
        }

        .input-bar {
            background: var(--surface);
            padding: 25px 30px;
            border-radius: var(--radius-box);
            box-shadow: var(--shadow-card);
            display: grid;
            grid-template-columns: 0.8fr 1fr 1fr 1.2fr auto; 
            gap: 20px;
            align-items: end;
            border: 1px solid var(--border);
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--secondary);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            background: #F9FAFB;
            transition: 0.3s;
            font-size: 14px;
            color: var(--primary);
            height: 46px;
        }
        
        .input-group select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%232C3E50%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
            padding-right: 30px;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent);
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .gen-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0 30px;
            height: 46px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .gen-btn:hover {
            background: #1a252f;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(44, 62, 80, 0.2);
        }

        .editor-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 100%;
            overflow: hidden;
        }

        .editor-pane {
            background: var(--surface);
            border-radius: var(--radius-box);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: 0.3s;
        }
        .editor-pane:hover { border-color: #D1D1D1; }

        .pane-header {
            padding: 15px 25px;
            border-bottom: 1px solid #F0F0F0;
            background: #fff;
            font-size: 13px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: 1px;
        }
        .pane-header.en { color: var(--accent); }
        .copy-btn {
            font-size: 12px; color: var(--secondary); cursor: pointer; border: none; background: none;
        }
        .copy-btn:hover { color: var(--primary); }

        .smart-textarea {
            flex: 1;
            width: 100%;
            border: none;
            padding: 25px;
            resize: none;
            font-size: 15px;
            line-height: 1.8;
            color: #444;
            outline: none;
            overflow-y: auto;
            background: #fff;
            font-family: inherit;
        }

        /* --- 模块2：模拟面试 --- */
        .interview-wrapper {
            max-width: 800px;
            margin: 40px auto;
            text-align: center;
            padding-bottom: 100px;
        }

        .question-card {
            background: var(--surface);
            padding: 60px 40px;
            border-radius: var(--radius-box);
            box-shadow: var(--shadow-card);
            margin-bottom: 30px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            position: relative;
        }
        .question-card::before {
            content: '"';
            position: absolute;
            top: 20px; left: 30px;
            font-size: 60px;
            color: #F0F0F0;
            font-family: serif;
        }

        .q-text {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.5;
            color: var(--primary);
            letter-spacing: 1px;
        }
        
        /* 隐藏之前的副标题，或者用来显示极简的提示 */
        .q-cn-sub {
            font-size: 15px; 
            color: #95A5A6; 
            font-weight: 400; 
            margin-top: 15px; 
            display: block;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-outline {
            padding: 12px 35px;
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--primary);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
        }

        .answer-panel {
            margin-top: 30px;
            padding: 30px;
            background: #fff;
            border-left: 4px solid var(--accent);
            text-align: left;
            border-radius: 0 16px 16px 0;
            box-shadow: var(--shadow-card);
            display: none;
            line-height: 1.8;
            color: #555;
            animation: slideDown 0.4s ease-out;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ans-block { margin-bottom: 20px; }
        .ans-label { 
            color: var(--accent); 
            font-weight: 700; 
            font-size: 13px; 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .ans-content { font-size: 15px; text-align: justify; }
        .ans-en { font-family: "Georgia", serif; font-size: 16px; color: #444; }
        .ans-variant { 
            background: #f9f9f9; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            border: 1px dashed #ddd;
        }

        /* --- 模块3：能量补给 --- */
        #energy-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100;
            display: none;
            background: #000;
        }

        #bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }

        .energy-content {
            position: relative;
            z-index: 20;
            height: 100%;
            width: 100%;
        }

        .prompt-wrapper {
            position: absolute;
            top: 35%; 
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            pointer-events: none; 
        }

        .cute-cn {
            color: #FFFFFF;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .cute-en {
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .exit-btn {
            position: absolute;
            top: 30px; right: 30px;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
            z-index: 30;
        }
        .exit-btn:hover { background: rgba(255,255,255,0.3); transform: rotate(90deg); }

        /* 响应式微调 */
        @media (max-width: 900px) {
            .input-bar { grid-template-columns: 1fr; gap: 10px; }
            .editor-split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fas fa-mountain"></i> 下一站，上岸！
        </div>
        <div class="nav-pills">
            <button class="nav-btn active" onclick="switchModule('intro')">自我介绍</button>
            <button class="nav-btn" onclick="switchModule('interview')">模拟面试</button>
            <button class="nav-btn" onclick="switchModule('energy')">⚡ 能量补给</button>
        </div>
    </header>

    <div class="main-container">
        
        <div id="intro" class="module-view active">
            <div class="intro-container">
                <div class="input-bar">
                    <div class="input-group">
                        <label>选择模版 (Template)</label>
                        <select id="tplSelect">
                            <option value="1">模版一</option>
                            <option value="2">模版二</option>
                            <option value="3">模版三</option>
                            <option value="4">模版四</option>
                            <option value="5">模版五</option>
                            <option value="6">模版六</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>基本信息 (Name/School/Major)</label>
                        <input type="text" id="inpName" placeholder="李明 / XX大学 / 计算机">
                    </div>
                    <div class="input-group">
                        <label>核心优势 (Achievements)</label>
                        <input type="text" id="inpStrength" placeholder="连续国奖 / 雅思7.0 / 论文">
                    </div>
                    <div class="input-group">
                        <label>未来规划 (Future Plan)</label>
                        <input type="text" id="inpPlan" placeholder="深耕AI医疗领域 / 读博">
                    </div>
                    <button class="gen-btn" onclick="generateIntro()">生成文稿</button>
                </div>

                <div class="editor-split">
                    <div class="editor-pane">
                        <div class="pane-header">
                            <span>CN 中文文稿</span>
                            <button class="copy-btn" onclick="copyText('resCN')">复制</button>
                        </div>
                        <textarea id="resCN" class="smart-textarea" placeholder="请在上方填写信息并选择模版，点击按钮生成..."></textarea>
                    </div>
                    <div class="editor-pane">
                        <div class="pane-header en">
                            <span>EN English Draft</span>
                            <button class="copy-btn" onclick="copyText('resEN')">Copy</button>
                        </div>
                        <textarea id="resEN" class="smart-textarea" placeholder="Draft will appear here..."></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div id="interview" class="module-view">
            <div class="interview-wrapper">
                <div class="question-card">
                    <div id="questionText" class="q-text">
                        准备好了吗？
                    </div>
                    <span id="questionSub" class="q-cn-sub"></span>
                </div>

                <div class="controls">
                    <button class="btn-outline" onclick="rollQuestion()">随机提问 (中文)</button>
                    <button class="btn-outline" style="border-color:#ccc; color:#666;" onclick="toggleAns()">查看参考思路</button>
                </div>

                <div id="answerArea" class="answer-panel"></div>
            </div>
        </div>

    </div>

    <div id="energy-layer">
        <video id="bg-video" loop muted playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-forest-stream-in-the-sunlight-529-large.mp4" type="video/mp4">
        </video>
        <audio id="bg-audio" loop>
            <source src="https://assets.mixkit.co/sfx/preview/mixkit-forest-ambience-1237.mp3" type="audio/mp3">
        </audio>

        <div class="energy-content">
            <button class="exit-btn" onclick="exitEnergy()" title="退出"><i class="fas fa-times"></i></button>
            
            <div class="prompt-wrapper">
                <div id="cute-cn" class="cute-cn"></div>
                <div id="cute-en" class="cute-en"></div>
            </div>
        </div>
    </div>

    <script>
        // --- 全局工具函数 ---
        function copyText(id) {
            const el = document.getElementById(id);
            el.select();
            document.execCommand('copy');
            alert("已复制到剪贴板 / Copied!");
        }

        // --- 模块切换逻辑 ---
        function switchModule(id) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(id === 'energy') {
                startEnergy();
            } else {
                document.querySelectorAll('.module-view').forEach(v => v.classList.remove('active'));
                document.getElementById(id).classList.add('active');
            }
        }

        // --- 1. 自我介绍生成器 (核心逻辑) ---
        
        // 模版数据库
        const introTemplates = {
            "1": {
                name: "综合全面型",
                cn: `尊敬的各位老师，您好！\n\n我叫 {name}，来自 {school} {major}专业，非常感谢能够有机会参加今天的复试。\n\n四年的本科生涯让我收获颇丰。我不仅注重专业知识的学习，还广泛参与了各类课外活动。在学术上，我始终保持刻苦学习的态度，成绩优异，获得了 {scholarship} 等奖学金，并参与了 {project} 科研项目，积累了不少实践经验。我深知科研需要团队协作，因此我积极参与创新实践，在这些经历中增强了自身的创新思维与解决实际问题的能力。\n\n在个人品德修养方面，我注重培养责任感。我长期参与志愿服务活动，如 {volunteer}，提升了自己对社会的认知与担当。\n\n展望未来，我的目标是将所学的专业知识与社会需求结合。关于未来的规划，我计划 {plan}。我期待在贵校继续追求学术卓越。\n\n再次感谢各位老师的聆听，期待有机会成为贵校的一员！`,
                en: `Dear teachers, hello!\n\nMy name is {name}, from {school}, majoring in {major}. I am very grateful for the opportunity to participate in today's interview.\n\nI have gained a lot in my four-year undergraduate career. I not only focus on professional knowledge but also participate in various extracurricular activities. Academically, I maintained a hard-working attitude with excellent grades, winning scholarships such as {scholarship}. I also participated in research projects like {project}, accumulating practical experience. I know that scientific research requires teamwork, so I actively participated in innovation practices, which enhanced my innovative thinking.\n\nIn terms of personal character, I focus on cultivating a sense of social responsibility. I have been involved in volunteer activities, such as {volunteer}, which enhanced my understanding of society.\n\nLooking into the future, my goal is to combine professional knowledge with social needs. As for my plan, {plan}. I look forward to continuing to pursue academic excellence in your school.\n\nThank you again for listening, and I look forward to the opportunity to become a member of your school!`
            },
            "2": {
                name: "学术科研型",
                cn: `尊敬的各位老师，下午好！\n\n我是来自 {school} {major}专业的 {name}，非常荣幸能参加此次面试。\n\n在本科期间，我始终保持对专业的高度关注，学习成绩优异，专业排名 {rank}，并连续获得奖学金。此外，我顺利通过了英语四六级考试。我认为本专业是一门充满活力的学科，因此在学习同时也积极参与科研。我曾参与 {project} 项目，并发表了 {paper} 篇文章。同时，我也曾以负责人的身份参与各类竞赛，荣获 {award} 等奖项。这些经历使我在创新思维、团队协作以及抗压能力方面（例如：{strength}）得到了极大的提升。\n\n“路漫漫其修远兮，吾将上下而求索。”我将继续在未来的学习生活中夯实理论基础，兼顾个人兴趣与导师研究方向。我的规划是：{plan}，力求将学术思想与研究成果展现于学术论文中。\n\n我的自我介绍完毕，再次感谢各位老师的聆听！`,
                en: `Dear teachers, good afternoon!\n\nI am {name} from {school}, majoring in {major}. I am very honored to participate in this interview.\n\nDuring my undergraduate studies, I always paid close attention to my major, achieved excellent academic results, ranked {rank} in my major, and received scholarships. In addition, I successfully passed the CET-4 and CET-6 exams. I believe that my major requires critical thinking and innovation. Therefore, I actively participated in scientific research projects, such as {project}, and have published {paper} articles. At the same time, I have participated in various competitions and won awards such as {award}. These experiences have greatly improved my innovative thinking and stress resistance (specifically: {strength}).\n\n"The road ahead is long and arduous, but I will continue to explore." I will continue to consolidate my theoretical foundation. My plan is: {plan}. I will strive to present my academic thoughts and research results in academic papers.\n\nMy self-introduction is over, and I thank all the teachers for listening again!`
            },
            "3": {
                name: "均衡简洁型",
                cn: `尊敬的各位教授，大家好！\n\n我叫 {name}，来自 {school}，专业是 {major}。在过去的四年里，我一直努力学习，并获得了一些荣誉，包括 {scholarship} 等奖学金。同时，由于我的实践能力突出，我不仅 {strength}，还被评为优秀学生干部。\n\n除了学术成绩，我还积极参与了社会活动，比如 {volunteer}。除此之外，我还在 {internship} 进行了实习，这些经历让我积累了宝贵的实践经验。\n\n对于未来的学习，我计划专注于 {plan} 研究方向，并力争建立对这一领域的系统性认识。希望通过三年的学习，我能为自己的职业生涯打下坚实的基础。\n\n我非常有责任心，凡是分配给我的任务都会尽全力去完成。空闲时，我喜欢阅读经典小说，认为这能够提高我的理解能力和沟通能力。\n\n如果能够有机会进入贵校深造，我将感到非常荣幸。以上就是我的自我介绍，谢谢各位教授！`,

        function generateIntro() {
            // 1. 获取输入
            let rawInfo = document.getElementById('inpName').value || "XXX / XX大学 / XX专业";
            let rawStrength = document.getElementById('inpStrength').value || "[我的优势/Strength]";
            let rawPlan = document.getElementById('inpPlan').value || "[我的规划/Plan]";
            
            // 2. 解析基本信息 (尝试按 "/" 分割)
            let parts = rawInfo.split(/[\/|，,]/); // 支持斜杠或逗号分割
            let valName = parts[0] ? parts[0].trim() : "XXX";
            let valSchool = parts[1] ? parts[1].trim() : "[学校名称]";
            let valMajor = parts[2] ? parts[2].trim() : "[专业名称]";

            // 3. 获取选择的模版
            let tplId = document.getElementById('tplSelect').value;
            let tpl = introTemplates[tplId];

            // 4. 替换函数
            function fillTemplate(text) {
                return text
                    .replace(/{name}/g, valName)
                    .replace(/{school}/g, valSchool)
                    .replace(/{major}/g, valMajor)
                    .replace(/{old_major}/g, valMajor) // 针对跨考模版暂用同一变量，提示用户修改
                    .replace(/{strength}/g, rawStrength)
                    .replace(/{plan}/g, rawPlan)
                    // 以下为模版中特有的占位符，统一初始化为提示语
                    .replace(/{scholarship}/g, "[奖学金名称]")
                    .replace(/{project}/g, "[科研/创新项目]")
                    .replace(/{paper}/g, "[论文数量/题目]")
                    .replace(/{award}/g, "[竞赛奖项]")
                    .replace(/{rank}/g, "[排名]")
                    .replace(/{volunteer}/g, "[志愿者活动]")
                    .replace(/{internship}/g, "[实习经历]");
            }

            // 5. 输出结果
            document.getElementById('resCN').value = fillTemplate(tpl.cn);
            document.getElementById('resEN').value = fillTemplate(tpl.en);
        }

        function rollQuestion() {
            const index = Math.floor(Math.random() * qaData.length);
            const q = qaData[index];
            const display = document.getElementById('questionText');
            const subDisplay = document.getElementById('questionSub');
            const answerBox = document.getElementById('answerArea');
            
            // 重置状态
            answerBox.style.display = 'none';
            // 注入内容
            answerBox.innerHTML = q.ans_html;
            
            // 打字机特效
            display.innerText = "";
            subDisplay.style.opacity = 0;
            
            let i = 0;
            const text = q.q_text; 
            function typing() {
                if (i < text.length) {
                    display.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, 35);
                } else {
                    // 打字结束后保持空白，不显示额外提示语
                    subDisplay.innerText = ""; 
                    subDisplay.style.opacity = 0;
                }
            }
            typing();
        }

        function toggleAns() {
            const box = document.getElementById('answerArea');
            if (getComputedStyle(box).display === 'none') {
                box.style.display = 'block';
                box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                box.style.display = 'none';
            }
        }
